<style>
  :root {

  .ai-title { color: var(--blue); font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }

  li { border-bottom: 1px solid #1c1c1e; padding: 10px 0; font-size: 0.9rem; }

  .day-log-details { background: #1c1c1e; border: 1px solid var(--border); padding: 12px; margin-top: 12px; border-radius: 12px; font-size: 0.85rem; }

  .nav-kaaba-band { width: 100%; height: 3.5px; background: var(--gold); }
</style>
